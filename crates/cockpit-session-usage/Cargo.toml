[package]
name = "cockpit-session-usage"
version = "0.1.0"
edition = "2021"

[workspace]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = "1.10"
zstd = "0.13"
sha2 = "0.10"
